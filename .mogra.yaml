# ProductionLine (mogra) v0.2.0 spoke config for JumpStart_Pro_Plus.
# Omitted fields inherit control-plane conventions (same defaults as TodoMVC-Plus).
# Protected: automated PRs may not modify this file or .github/workflows/.

version: 1

runtime:
  build: local # local: `node src/local-runner.mjs build|next` on your machine with Claude Code; GitHub verifies, merges, deploys. cloud: GitHub Actions builds with Gemini
  harness: claude-code # gemini-cli | antigravity | claude-code | codex | goose | openhands | aider
  model: sonnet

# Per-agent overrides, e.g.:
# agents:
#   rails-fullstack-builder:
#     harness: claude-code
#     model: claude-sonnet-4-5

human_in_the_loop:
  enabled: false # set true to require the mogra:approved label before build/merge

outcome:
  blueprint: jumpstart-pro-plus
  stack: rails8-pg-hotwire
  mode: incremental-feature
  capabilities:
    - rails-multi-tenant-security
    - mckinsey-light-rails-ui # light-only, McKinsey-inspired UI (no brand assets)
    - railway-neon-free-tier-ops
    - wcag-reflow-a11y
    - security-hardening

deployment:
  target: railway # Railway free plan + Neon free Postgres (no credit card, never billable)
  railway:
    health_path: /up
    service_name: jumpstart-pro-plus

name: ProductionLine (mogra)

on:
  issues:
    types: [opened, labeled]
  repository_dispatch:
    types: [mogra.trigger]
  pull_request:
    types: [labeled] # PRs built locally by mogra (label mogra:built) are verified, merged and deployed here

permissions: {}

jobs:
  mogra:
    if: >-
      github.event_name != 'issues' ||
      github.event.action == 'opened' ||
      (github.event.action == 'labeled' && (github.event.label.name == 'mogra:approved' || github.event.label.name == 'mogra:run'))
    # Tracks the ProductionLine main branch (v0.2.0 released); pin a tag such as @v0.2.0 for a frozen control plane.
    uses: rajeevkannav/ProductionLine/.github/workflows/mogra-sdlc.yml@main
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
      deployments: read # mogra waits for the host's deploy of the merge commit
      security-events: write
    with:
      control_plane_repo: "rajeevkannav/ProductionLine"
      control_plane_ref: "main"
    secrets:
      MOGRA_BOT_TOKEN: ${{ secrets.MOGRA_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RAILWAY_APP_URL: ${{ secrets.RAILWAY_APP_URL }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
